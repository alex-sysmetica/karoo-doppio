org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# true: each module's R class holds only that module's own resources.
android.nonTransitiveRClass=true

# The permanent ids: the one source. generateExtensionInfo writes them into the extension XML
# and into BuildConfig, and ids.lock freezes them. They bind on the first install on a ride
# page: never change or remove one. The field count may grow, never shrink.
doppio.extensionId=doppio
doppio.typePrefix=doppio-
doppio.fieldCount=10

# The probe build type: its own ids, so it never registers the permanent ones.
doppio.probe.extensionId=doppioprobe
doppio.probe.typePrefix=probe-
doppio.probe.fieldCount=3

# The version: the same name in every build type. The code rises by 1 for every build signed
# with the release key that reaches a Karoo.
doppio.versionCode=1
doppio.versionName=1.0.0

# The public repository: the update manifest's address and the release downloads are built
# from it.
doppio.repoUrl=https://github.com/alex-sysmetica/karoo-doppio
